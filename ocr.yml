name: Mobile Video OCR

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: '레포지토리에 올린 영상 파일명 (예: video.mp4)'
        required: true
        default: 'video.mp4'
        type: string

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 도구 설치 (FFmpeg, Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-kor

      - name: 프레임 추출
        run: |
          mkdir -p frames
          # 사용자가 입력한 파일명을 변수(${{ github.event.inputs.video_filename }})로 받아와서 처리
          ffmpeg -i "${{ github.event.inputs.video_filename }}" -vf fps=0.33 frames/out_%04d.png

      - name: 텍스트 추출 (한국어 + 영어)
        run:
