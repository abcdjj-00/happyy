name: Mobile Video OCR

on:
  workflow_dispatch:

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 도구 설치 (FFmpeg, Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-kor

      - name: 프레임 추출 (레포지토리에 올린 video.mp4 기준)
        run: |
          mkdir -p frames
          # 5시간짜리 영상이므로 3초마다 1장씩 프레임 추출 (fps=0.33)
          ffmpeg -i video.mp4 -vf fps=0.33 frames/out_%04d.png

      - name: 텍스트 추출 및 프레임별 기록
        run: |
          echo "=== 영상 OCR 추출 결과 (프레임별) ===" > final_result.txt
          for img in frames/*.png; do
            filename=$(basename "$img")
            echo "--- [프레임: $filename] ---" >> final_result.txt
            tesseract "$img" stdout -l kor+eng --psm 6 >> final_result.txt
            echo "" >> final_result.txt
          done

      - name: 결과 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: ocr-text-result
          path: final_result.txt
